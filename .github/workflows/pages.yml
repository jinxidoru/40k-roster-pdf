name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r web src assets _site/
      - name: Cache-bust asset URLs
        run: |
          VER="${GITHUB_SHA::8}"
          # Stamp every local JS module import + the worker URL + the entry
          # script/stylesheet with ?v=<sha> so a deploy's assets always load as a
          # consistent set (no stale index.html + fresh app.js mismatches).
          find _site -name '*.js' -print0 | xargs -0 perl -pi -e "s{from '(\.\.?/[^']+\.js)'}{from '\$1?v=$VER'}g"
          find _site -name '*.js' -print0 | xargs -0 perl -pi -e "s{new URL\('\./worker\.js'}{new URL('./worker.js?v=$VER'}g"
          perl -pi -e "s{(src=\"web/app\.js)\"}{\$1?v=$VER\"}g; s{(href=\"web/style\.css)\"}{\$1?v=$VER\"}g" _site/index.html
          # Stamp the version badge: point it at this commit and show the short sha.
          perl -pi -e "s{(<a id=\"version\"[^>]*href=\")[^\"]*(\"[^>]*>)dev(</a>)}{\${1}https://github.com/jinxidoru/40k-roster-pdf/commit/$GITHUB_SHA\${2}$VER\${3}}g" _site/index.html
          echo "Stamped assets with v=$VER"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
