<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Card styles lab</title>
  <style>
    :root { --bg: #f4f4f5; --ink: #1a1a1a; --muted: #6b7280; --line: #e2e2e5; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 20px; font: 14px/1.4 system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .note { color: var(--muted); font-size: 12.5px; margin: 0 0 14px; }
    .bar { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
    #status { color: var(--muted); font-size: 13px; }
    select { font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; }
    .style { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; margin-bottom: 16px; }
    .style h2 { font-size: 15px; margin: 0 0 10px; }
    .pair { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
    .col { }
    .cap { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .out svg { display: block; max-width: 340px; height: auto; }
    .err { color: #c8102e; font-size: 11px; white-space: pre-wrap; max-width: 340px; }
  </style>
</head>
<body>
  <h1>Card styles lab</h1>
  <p class="note">Dev-only comparison of the five card styles for a short unit and a
    long (multi-card) unit. Not part of the app. Pass <code>?preload=&lt;file&gt;</code>
    to use another roster from <code>staging/</code>.</p>
  <div class="bar">
    <label>Card size <select id="size"></select></label>
    <span>Roster: <strong id="roster">…</strong></span>
    <span id="status"></span>
  </div>
  <div id="grid"></div>
  <script type="module" src="cards-lab.js"></script>
</body>
</html>
